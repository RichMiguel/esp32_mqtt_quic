# ====================================================================
# NanoMQ Edge Broker Configuration with MQTT over QUIC Bridging
# Project: IoT Air Quality Monitor (ESP32 -> NanoMQ -> EMQX QUIC -> Node-RED)
# ====================================================================

# 1. Listener TCP Lokal
# Mendengarkan koneksi lokal dari ESP32 dan Node-RED (Port 1885 menghindari konflik dengan Mosquitto di port 1883)
listeners.tcp {
  bind = "0.0.0.0:1885"
}

# 2. Bridge MQTT over QUIC ke Broker EMQX
bridges.mqtt.emqx1 {
  # Server target EMQX yang mendukung port QUIC (default 14567 UDP)
  # Ganti 'broker.emqx.io' dengan IP/domain broker EMQX Anda jika menggunakan server sendiri
  server = "mqtt-quic://broker.emqx.io:14567"
  
  proto_ver = 4
  keepalive = 60s
  clean_start = true
  clientid = "nanomq_edge_laptop"

  # Forward: Meneruskan data dari ESP32 lokal ke Cloud EMQX via QUIC
  forwards = [
    {
      local_topic = "sensor/air_quality"
      remote_topic = "sensor/air_quality"
      qos = 1
    }
  ]

  # Subscription: Mengambil balik data dari EMQX via QUIC
  # Data ini akan didistribusikan ke client lokal seperti Node-RED pada topik 'sensor/air_quality/remote'
  subscription = [
    {
      remote_topic = "sensor/air_quality"
      local_topic = "sensor/air_quality/remote"
      qos = 1
    }
  ]
}

# 3. Pengaturan Log
log {
  to = ["file", "console"]
  level = "info"
  dir = "./log"
  file = "nanomq.log"
}
